[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taskforge-image-plugin"
version = "0.1.0"
description = "TaskForge example image processing plugin"
dependencies = [
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.entry-points."taskforge.handlers"]
image_resize = "image_plugin.handler:handle_image_resize"
